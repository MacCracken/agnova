name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml `[package].cyrius` pin is the single source of
          # truth for the toolchain version (CLAUDE.md § CI/Release) — no
          # version is hardcoded in this YAML. Read the pin and hand it to the
          # upstream installer, which fetches + lays out $HOME/.cyrius/{bin,lib}.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Lint
        run: |
          set -e
          rc=0
          for f in src/*.cyr; do
            out=$(cyrius lint "$f")
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -qE '^[[:space:]]*(warn|deferral) line '; then
              echo "::error file=$f::cyrlint reported warnings or untracked deferrals"
              rc=1
            fi
          done
          exit $rc

      - name: Format check
        run: |
          set -e
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr; do
            cyrfmt --check "$f"
          done

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/agnova

      - name: Test suite
        run: |
          out=$(cyrius test tests/agnova.tcyr 2>&1)
          tail=$(echo "$out" | tail -1)
          echo "$tail"
          # Must say "N passed, 0 failed (N total)"
          echo "$tail" | grep -qE '^[0-9]+ passed, 0 failed \([0-9]+ total\)$'

      - name: Smoke test (version)
        run: |
          out=$(./build/agnova version)
          echo "$out"
          echo "$out" | grep -q "^agnova "
          echo "$out" | grep -q "^cyrius "

      - name: Smoke test (plan)
        run: |
          ./build/agnova plan --device /dev/sda --user ci > /tmp/plan.txt
          echo "--- plan output ---"
          cat /tmp/plan.txt
          echo "--- assertions ---"
          grep -q "validation: OK" /tmp/plan.txt
          # ⚠ The operation count tracks the PLAN, so it moves whenever the plan
          # legitimately changes — that is the point of asserting it, but it means
          # the number needs updating with the change that moved it.
          # 60 -> 59 at 0.7.1: the `--user is now optional` doctrine change disarms
          # the default compat account (no `wheel` group, enable_sudo=0), so Phase 8
          # emits `useradd -G agents` only and no longer emits `usermod -aG wheel`.
          grep -q "13 phases, 59 operations" /tmp/plan.txt
          grep -q "bootloader: gnoboot" /tmp/plan.txt

      - name: Smoke test (execute gate)
        run: |
          # Should refuse without --i-mean-it and exit 2.
          set +e
          out=$(./build/agnova execute --device /dev/sda --user ci 2>&1)
          rc=$?
          echo "$out"
          test "$rc" = "2"
          echo "$out" | grep -q "DANGER"
          echo "$out" | grep -q "i-mean-it"

  changelog:
    name: CHANGELOG updated
    # Every PR must record its change (Keep a Changelog policy, see CLAUDE.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -qx "CHANGELOG.md"; then
            echo "OK: CHANGELOG.md updated in this PR"
          else
            echo "ERROR: this PR does not modify CHANGELOG.md."
            echo "Add an entry under [Unreleased] (https://keepachangelog.com/)."
            exit 1
          fi

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          set -e
          required=(
            README.md
            CHANGELOG.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            VERSION
            LICENSE
            cyrius.cyml
            CLAUDE.md
            docs/architecture/overview.md
            docs/development/roadmap.md
          )
          for doc in "${required[@]}"; do
            test -f "$doc" && echo "OK: $doc" || { echo "MISSING: $doc"; exit 1; }
          done
